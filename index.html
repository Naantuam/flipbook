<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beatrice and Emmanuel</title>
  <style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  font-family: Arial, sans-serif;
  touch-action: pan-y;
}

h1 {
  margin: 2vh 0;
  font-size: clamp(1rem, 4vw, 1.5rem);
  text-align: center;
  color: #fff;
}

/* Flipbook container */
.flipbook {
  position: relative;
  width: 100vw;        /* full width on mobile */
  height: 100dvh;      /* dynamic viewport height */
  overflow: hidden;
  background: none;
  box-shadow: none;
  border-radius: 0;
  margin: 0 auto;
}

/* Each page */
.page {
  position: absolute;
  top: 0;
  left: 100%;
  width: 100%;
  height: 100%;
  display: flex;               /* center the image */
  justify-content: center;
  align-items: center;
  transition: left 0.3s ease;
  overflow: hidden;            /* prevent image overflow */
}

/* Make the image fit fully */
.page img {
  max-width: 90%;       /* reduce width */
  max-height: 90%;      /* reduce height */
  object-fit: contain;  /* show the whole image, no crop */
}

.page.active {
  left: 0;
}

.page.prev {
  left: -100%;
}

/* Larger screens — narrower width */
@media (min-width: 800px) {
  body {
    background: #f0f0f0; /* show background on big screens */
  }

  .flipbook {
    width: 55vw;          /* narrower width */
    height: 100vh;        /* full height still */
    margin: 0 auto;
  }

  .page img {
    max-width: 85%;       /* slightly smaller on large screens */
    max-height: 85%;
    object-fit: contain;
    background: #000;     /* optional background */
  }
}

  </style>
</head>
<body>

  <div class="flipbook" id="flipbook">
    <div class="page active"><img src="Pages/Beatrice & Emmanuel wedding program.jpg" alt="Page 1"></div>
    <div class="page"><img src="Pages/Beatrice & Emmanuel wedding program01.jpg" alt="Page 2"></div>
    <div class="page"><img src="Pages/Beatrice & Emmanuel wedding program02.jpg" alt="Page 3"></div>
    <div class="page"><img src="Pages/Beatrice & Emmanuel wedding program04.jpg" alt="Page 4"></div>
    <div class="page"><img src="Pages/Beatrice & Emmanuel wedding program05.jpg" alt="Page 5"></div>
    <div class="page"><img src="Pages/Beatrice & Emmanuel wedding program06.jpg" alt="Page 6"></div>
    <div class="page"><img src="Pages/Beatrice & Emmanuel wedding program07.jpg" alt="Page 7"></div>
  </div>

  <script>
    const pages = document.querySelectorAll('.page');
    let currentPage = 0;

    function showPage(index) {
      pages.forEach((page, i) => {
        page.classList.remove('active', 'prev');
        if (i === index) {
          page.classList.add('active');
        } else if (i === index - 1) {
          page.classList.add('prev');
        }
      });
    }

    // swipe detection
    let startX = 0;
    let isDown = false;

    const flipbook = document.getElementById('flipbook');

    flipbook.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
      isDown = true;
    });

    flipbook.addEventListener('touchend', e => {
      if (!isDown) return;
      isDown = false;
      const endX = e.changedTouches[0].clientX;
      handleSwipe(endX - startX);
    });

    // also allow mouse drag on desktop
    flipbook.addEventListener('mousedown', e => {
      startX = e.clientX;
      isDown = true;
    });

    flipbook.addEventListener('mouseup', e => {
      if (!isDown) return;
      isDown = false;
      const endX = e.clientX;
      handleSwipe(endX - startX);
    });

    function handleSwipe(deltaX) {
      if (deltaX < -50) {
        // swipe left → next page
        currentPage = (currentPage + 1) % pages.length;
        showPage(currentPage);
      } else if (deltaX > 50) {
        // swipe right → previous page
        currentPage = (currentPage - 1 + pages.length) % pages.length;
        showPage(currentPage);
      }
    }

    // init
    showPage(currentPage);
  </script>
</body>
</html>
